<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyrene Memory</title>
  <style>
    :root { --bg:#141018; --card:#1e1926; --fg:#e8e2f0; --dim:#8d84a0; --accent:#c9a0ff; --border:#2d2638; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.6 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:20px 28px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:16px; }
    header h1 { margin:0; font-size:20px; }
    header .dim { color:var(--dim); font-size:12px; }
    main { padding:20px 28px; }
    .tabs { display:flex; gap:6px; margin-bottom:16px; }
    .tab { padding:6px 14px; border:1px solid var(--border); background:transparent; color:var(--dim); border-radius:6px; cursor:pointer; }
    .tab.active { border-color:var(--accent); color:var(--accent); }
    .stat { display:flex; gap:24px; margin-bottom:20px; }
    .stat div { padding:12px 18px; background:var(--card); border-radius:8px; border:1px solid var(--border); }
    .stat b { color:var(--accent); font-size:20px; }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:8px; overflow:hidden; }
    th, td { padding:8px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:13px; vertical-align:top; }
    th { color:var(--dim); font-weight:500; background:#191422; }
    tr:last-child td { border-bottom:none; }
    button.del { padding:2px 10px; border:1px solid #663; background:transparent; color:#e66; border-radius:4px; cursor:pointer; }
    button.del:hover { background:#331a1a; }
    .empty { color:var(--dim); padding:30px; text-align:center; }
    .panel { display:none; }
    .panel.active { display:block; }
    .loading { color:var(--dim); padding:20px; }
  </style>
</head>
<body>
  <header>
    <h1>Cyrene Memory</h1>
    <span class="dim">L0 画像 · L1 工作记忆 · L2 长期事件</span>
  </header>
  <main>
    <div class="stat" id="stats"><div>加载中…</div></div>
    <div class="tabs">
      <button class="tab active" data-tab="l0">L0 画像</button>
      <button class="tab" data-tab="l1">L1 工作记忆</button>
      <button class="tab" data-tab="l2">L2 长期事件</button>
    </div>
    <div class="panel active" id="panel-l0"><div class="loading">加载中…</div></div>
    <div class="panel" id="panel-l1"><div class="loading">加载中…</div></div>
    <div class="panel" id="panel-l2"><div class="loading">加载中…</div></div>
  </main>

  <script type="module">
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    // 等待 AstrBot 父页面注入 bridge（最多 10 秒）
    async function waitBridge(timeoutMs = 10000) {
      const t0 = Date.now();
      while (Date.now() - t0 < timeoutMs) {
        if (window.AstrBotPluginPage) return window.AstrBotPluginPage;
        await new Promise(r => setTimeout(r, 100));
      }
      throw new Error("等待 AstrBotPluginPage bridge 超时");
    }

    async function apiGet(path) {
      const bridge = await waitBridge();
      if (bridge.ready) { try { await bridge.ready(); } catch (e) {} }
      return bridge.apiGet(path, {});
    }

    async function apiPost(path, body) {
      const bridge = await waitBridge();
      if (bridge.ready) { try { await bridge.ready(); } catch (e) {} }
      return bridge.apiPost(path, body);
    }

    async function loadStats() {
      try {
        const d = await apiGet("page/stats");
        document.getElementById("stats").innerHTML =
          `<div><b>${d.l0 ?? 0}</b> L0 画像</div>` +
          `<div><b>${d.l1 ?? 0}</b> L1 工作记忆</div>` +
          `<div><b>${d.l2 ?? 0}</b> L2 长期事件</div>`;
      } catch (e) {
        document.getElementById("stats").innerHTML = `<div>统计加载失败: ${esc(e.message)}</div>`;
      }
    }

    function ts(t) {
      if (!t) return "";
      const d = new Date(t * 1000);
      return d.toLocaleString("zh-CN", { hour12: false });
    }

    async function loadL0() {
      const el = document.getElementById("panel-l0");
      try {
        const d = await apiGet("page/l0");
        const items = d.items || [];
        if (!items.length) { el.innerHTML = `<div class="empty">L0 为空</div>`; return; }
        el.innerHTML = `<table><thead><tr><th>ID</th><th>用户</th><th>分类</th><th>键</th><th>值</th><th>更新时间</th><th></th></tr></thead><tbody>` +
          items.map(r => `<tr>
            <td>${r.id}</td>
            <td>${esc(r.user_id)}</td>
            <td>${esc(r.category)}</td>
            <td>${esc(r.key)}</td>
            <td>${esc(r.value)}</td>
            <td>${ts(r.updated_at)}</td>
            <td><button class="del" data-kind="l0" data-id="${r.id}">删除</button></td>
          </tr>`).join("") + `</tbody></table>`;
      } catch (e) {
        el.innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`;
      }
    }

    async function loadL1() {
      const el = document.getElementById("panel-l1");
      try {
        const d = await apiGet("page/l1");
        const items = d.items || [];
        if (!items.length) { el.innerHTML = `<div class="empty">L1 为空</div>`; return; }
        el.innerHTML = `<table><thead><tr><th>ID</th><th>用户</th><th>角色</th><th>内容</th><th>时间</th><th></th></tr></thead><tbody>` +
          items.map(r => `<tr>
            <td>${r.id}</td>
            <td>${esc(r.user_id)}</td>
            <td>${esc(r.role)}</td>
            <td>${esc(r.preview)}</td>
            <td>${ts(r.created_at)}</td>
            <td><button class="del" data-kind="l1" data-id="${r.id}">删除</button></td>
          </tr>`).join("") + `</tbody></table>`;
      } catch (e) {
        el.innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`;
      }
    }

    async function loadL2() {
      const el = document.getElementById("panel-l2");
      try {
        const d = await apiGet("page/l2");
        const items = d.items || [];
        if (!items.length) { el.innerHTML = `<div class="empty">L2 为空</div>`; return; }
        el.innerHTML = `<table><thead><tr><th>ID</th><th>用户</th><th>内容</th><th>情感</th><th>标签</th><th>重要度</th><th>时间</th><th></th></tr></thead><tbody>` +
          items.map(r => `<tr>
            <td>${r.id}</td>
            <td>${esc(r.user_id)}</td>
            <td>${esc(r.content)}</td>
            <td>${esc(r.sentiment || "")}</td>
            <td>${esc(r.tags || "")}</td>
            <td>${r.importance}</td>
            <td>${ts(r.created_at)}</td>
            <td><button class="del" data-kind="l2" data-id="${r.id}">删除</button></td>
          </tr>`).join("") + `</tbody></table>`;
      } catch (e) {
        el.innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`;
      }
    }

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.body.addEventListener("click", async (e) => {
      const btn = e.target.closest("button.del");
      if (!btn) return;
      if (!confirm("确认删除这条记忆？")) return;
      const kind = btn.dataset.kind;
      const id = btn.dataset.id;
      try {
        await apiPost(`page/${kind}/delete`, { id: Number(id) });
        if (kind === "l0") loadL0();
        else if (kind === "l1") loadL1();
        else loadL2();
        loadStats();
      } catch (err) {
        alert("删除失败: " + err.message);
      }
    });

    loadStats();
    loadL0();
    loadL1();
    loadL2();
  </script>
</body>
</html>
