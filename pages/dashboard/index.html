<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyrene Memory</title>
  <style>
    :root { --bg:#141018; --card:#1e1926; --fg:#e8e2f0; --dim:#8d84a0; --accent:#c9a0ff; --border:#2d2638; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.6 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:20px 28px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:16px; }
    header h1 { margin:0; font-size:20px; }
    header .dim { color:var(--dim); font-size:12px; }
    main { padding:20px 28px; }
    .stat { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:20px; }
    .stat div { padding:12px 18px; background:var(--card); border-radius:8px; border:1px solid var(--border); min-width: 100px; text-align: center;}
    .stat b { display:block; color:var(--accent); font-size:24px; line-height:1.2; margin-bottom:4px;}
    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .tab { padding:6px 14px; border:1px solid var(--border); background:transparent; color:var(--dim); border-radius:6px; cursor:pointer; }
    .tab.active { border-color:var(--accent); color:var(--accent); background:rgba(201,160,255,0.05); }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:8px; overflow:hidden; }
    th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); font-size:13px; vertical-align:top; }
    th { color:var(--dim); font-weight:500; background:#191422; }
    tr:last-child td { border-bottom:none; }
    button { padding:4px 10px; border-radius:4px; cursor:pointer; border:none; font-size:12px; color:#fff; transition:0.2s; }
    button:hover { opacity:0.8; }
    .btn-edit { background:#4a4a5a; }
    .btn-simp { background:#5a4a8a; }
    .btn-sum { background:#3a7a5a; }
    .btn-del { background:#8a3a3a; }
    .empty { color:var(--dim); padding:30px; text-align:center; }
    .panel { display:none; }
    .panel.active { display:block; }
    .loading { color:var(--dim); padding:20px; text-align:center; }
    .archive-box { margin-bottom: 20px; padding: 12px; background: #191422; border-radius: 8px; border: 1px dashed var(--border); }
    .archive-btn { background: #2d2638; color: var(--accent); margin: 4px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <h1>Cyrene Memory</h1>
    <span class="dim">L0 画像 · L1 工作记忆 · L2 长期事件</span>
  </header>
  <main>
    <div class="stat" id="stats">
      <div><b id="stat-l0">0</b> L0 画像</div>
      <div><b id="stat-l1">0</b> L1 工作记忆</div>
      <div><b id="stat-l2">0</b> L2 长期事件</div>
      <div><b id="stat-rel">0</b> 关系状态</div>
      <div><b id="stat-tasks">0</b> 活跃任务</div>
      <div><b id="stat-raw">0</b> 原始数据</div>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="l0">L0 画像</button>
      <button class="tab" data-tab="l1">L1 工作记忆</button>
      <button class="tab" data-tab="raw">原始数据</button>
      <button class="tab" data-tab="l2">L2 长期事件</button>
      <button class="tab" data-tab="rel">关系状态</button>
      <button class="tab" data-tab="tasks">任务看板</button>
    </div>

    <div class="panel active" id="panel-l0"><div class="loading">加载中…</div></div>
    <div class="panel" id="panel-l1"><div class="loading">加载中…</div></div>
    <div class="panel" id="panel-raw"><div class="loading">加载中…</div></div>
    <div class="panel" id="panel-l2"><div class="loading">加载中…</div></div>
    <div class="panel" id="panel-rel"><div class="loading">加载中…</div></div>
    <div class="panel" id="panel-tasks"><div class="loading">加载中…</div></div>
  </main>

  <script type="module">
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }
    function ts(t) {
      if (!t) return "";
      return new Date(t * 1000).toLocaleString("zh-CN", { hour12: false });
    }

    async function waitBridge(timeoutMs = 10000) {
      const t0 = Date.now();
      while (Date.now() - t0 < timeoutMs) {
        if (window.AstrBotPluginPage) return window.AstrBotPluginPage;
        await new Promise(r => setTimeout(r, 100));
      }
      throw new Error("等待 AstrBotPluginPage bridge 超时");
    }

    async function apiGet(path) {
      const bridge = await waitBridge();
      if (bridge.ready) { try { await bridge.ready(); } catch (e) {} }
      return bridge.apiGet(path, {});
    }

    async function apiPost(path, body) {
      const bridge = await waitBridge();
      if (bridge.ready) { try { await bridge.ready(); } catch (e) {} }
      return bridge.apiPost(path, body);
    }

    // --- 数据加载器 ---

    async function loadStats() {
      try {
        const d = await apiGet("page/stats");
        document.getElementById("stat-l0").innerText = d.l0 ?? 0;
        document.getElementById("stat-l1").innerText = d.l1 ?? 0;
        document.getElementById("stat-l2").innerText = d.l2 ?? 0;
        document.getElementById("stat-rel").innerText = d.rel ?? 0;
        document.getElementById("stat-tasks").innerText = d.tasks ?? 0;
        document.getElementById("stat-raw").innerText = d.raw ?? 0;
      } catch (e) { console.error(e); }
    }

    async function loadL0() {
      const el = document.getElementById("panel-l0");
      try {
        const d = await apiGet("page/l0");
        const items = d.items || [];
        if (!items.length) { el.innerHTML = `<div class="empty">L0 为空</div>`; return; }
        el.innerHTML = `<table><thead><tr><th>ID</th><th>分类</th><th>键</th><th>值</th><th>时间</th><th style="width:220px;">操作</th></tr></thead><tbody>` +
          items.map(r => `<tr>
            <td>${r.id}</td>
            <td>${esc(r.category)}</td>
            <td>${esc(r.key)}</td>
            <td id="val-${r.id}" style="max-width: 300px; word-wrap: break-word;">${esc(r.value)}</td>
            <td>${ts(r.updated_at)}</td>
            <td>
              <button class="btn-edit" data-id="${r.id}" data-val="${esc(r.value)}">编辑</button>
              <button class="btn-simp" data-id="${r.id}" data-val="${esc(r.value)}">精简</button>
              <button class="btn-sum" data-id="${r.id}" data-cat="${esc(r.category)}" data-key="${esc(r.key)}" data-val="${esc(r.value)}">重总结</button>
              <button class="btn-del" data-kind="l0" data-id="${r.id}">删除</button>
            </td>
          </tr>`).join("") + `</tbody></table>`;
      } catch (e) { el.innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`; }
    }

    async function loadL1() {
      const el = document.getElementById("panel-l1");
      try {
        const d = await apiGet("page/l1");
        const items = d.items || [];
        if (!items.length) { el.innerHTML = `<div class="empty">L1 工作记忆为空</div>`; return; }
        el.innerHTML = `<table><thead><tr><th>键</th><th>值</th><th>时间</th><th style="width:60px;"></th></tr></thead><tbody>` +
          items.map(r => `<tr>
            <td>${esc(r.key)}</td>
            <td style="max-width: 400px; word-wrap: break-word;">${esc(r.value)}</td>
            <td>${ts(r.updated_at)}</td>
            <td><button class="btn-del" data-kind="l1" data-id="${r.id}">删除</button></td>
          </tr>`).join("") + `</tbody></table>`;
      } catch (e) { el.innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`; }
    }

    async function loadRaw() {
      const el = document.getElementById("panel-raw");
      try {
        const d = await apiGet("page/raw_logs");
        const items = d.items || [];
        
        // 拉取归档
        let archiveHtml = "";
        try {
          const ad = await apiGet("page/archives");
          let archives = ad.items || [];
          if (archives.length > 0) {
            archives.sort((a, b) => b.localeCompare(a));
            archiveHtml = `<div class="archive-box">
              <strong style="color:var(--accent)">已归档冷数据:</strong><br/>
              ` + archives.map(f => `<button class="archive-btn" data-file="${esc(f)}">📦 ${esc(f)}</button>`).join("") + `</div>`;
          }
        } catch (e) {}

        if (!items.length) { el.innerHTML = archiveHtml + `<div class="empty">暂无原始数据</div>`; return; }
        el.innerHTML = archiveHtml + `<table><thead><tr><th>ID</th><th>角色</th><th>内容片段</th><th>时间</th></tr></thead><tbody>` +
          items.map(r => `<tr>
            <td>${r.id}</td>
            <td>${esc(r.role)}</td>
            <td>${esc(r.preview)}</td>
            <td>${ts(r.created_at)}</td>
          </tr>`).join("") + `</tbody></table>`;
      } catch (e) { el.innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`; }
    }

    async function loadL2() {
      const el = document.getElementById("panel-l2");
      try {
        const d = await apiGet("page/l2");
        const items = d.items || [];
        if (!items.length) { el.innerHTML = `<div class="empty">L2 为空</div>`; return; }
        el.innerHTML = `<table><thead><tr><th>ID</th><th>内容</th><th>情感标签</th><th>结构化情感</th><th>时间</th><th style="width:60px;"></th></tr></thead><tbody>` +
          items.map(r => `<tr>
            <td>${r.id}</td>
            <td>${esc(r.content)}</td>
            <td>${esc(r.emotion_note || "-")}</td>
            <td>${esc(r.sentiment || "")}</td>
            <td>${ts(r.created_at)}</td>
            <td><button class="btn-del" data-kind="l2" data-id="${r.id}">删除</button></td>
          </tr>`).join("") + `</tbody></table>`;
      } catch (e) { el.innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`; }
    }

    async function loadRel() {
      const el = document.getElementById("panel-rel");
      try {
        const d = await apiGet("page/relationship");
        const items = d.items || [];
        if (!items.length) { el.innerHTML = `<div class="empty">暂无关系数据</div>`; return; }
        el.innerHTML = `<table><thead><tr><th>用户</th><th>关系阶段</th><th>近期情绪</th><th>最后更新</th></tr></thead><tbody>` +
          items.map(r => `<tr>
            <td>${esc(r.user_id)}</td>
            <td style="color:var(--accent); font-weight:bold;">${esc(r.stage)}</td>
            <td>${esc(r.recent_mood)}</td>
            <td>${ts(r.updated_at)}</td>
          </tr>`).join("") + `</tbody></table>`;
      } catch (e) { el.innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`; }
    }

    async function loadTasks() {
      const el = document.getElementById("panel-tasks");
      try {
        const d = await apiGet("page/tasks");
        const items = d.items || [];
        if (!items.length) { el.innerHTML = `<div class="empty">暂无任务</div>`; return; }
        el.innerHTML = `<table><thead><tr><th>状态</th><th>任务标题</th><th>最新摘要</th><th>最后更新</th></tr></thead><tbody>` +
          items.map(r => `<tr>
            <td style="color:${r.status === 'done' ? '#888' : 'var(--accent)'}; font-weight:bold;">${esc(r.status)}</td>
            <td>${esc(r.title)}</td>
            <td>${esc(r.summary)}</td>
            <td>${ts(r.updated_at)}</td>
          </tr>`).join("") + `</tbody></table>`;
      } catch (e) { el.innerHTML = `<div class="empty">加载失败: ${esc(e.message)}</div>`; }
    }

    // --- 事件绑定 ---

    document.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
      });
    });

    document.body.addEventListener("click", async (e) => {
      // 1. 编辑
      const btnEdit = e.target.closest(".btn-edit");
      if (btnEdit) {
        const id = btnEdit.dataset.id;
        const oldVal = btnEdit.dataset.val;
        const newVal = prompt("修改内容:", oldVal);
        if (newVal !== null && newVal !== oldVal) {
          btnEdit.innerText = "...";
          try {
            const res = await apiPost("page/l0/update", { id: Number(id), value: newVal });
            if (res.ok) document.getElementById("val-" + id).innerText = res.value;
          } catch(err) { alert("修改失败"); }
          btnEdit.innerText = "编辑";
        }
        return;
      }

      // 2. 精简
      const btnSimp = e.target.closest(".btn-simp");
      if (btnSimp) {
        const id = btnSimp.dataset.id;
        const oldVal = btnSimp.dataset.val;
        btnSimp.innerText = "处理中...";
        btnSimp.disabled = true;
        try {
          const res = await apiPost("page/l0/simplify", { id: Number(id), value: oldVal });
          if (res.ok) {
            document.getElementById("val-" + id).innerText = res.value;
            btnSimp.dataset.val = res.value;
          } else alert(res.msg || "精简失败");
        } catch(err) { alert("请求失败"); }
        btnSimp.innerText = "精简";
        btnSimp.disabled = false;
        return;
      }

      // 3. 重总结
      const btnSum = e.target.closest(".btn-sum");
      if (btnSum) {
        const id = btnSum.dataset.id;
        const cat = btnSum.dataset.cat;
        const key = btnSum.dataset.key;
        const oldVal = btnSum.dataset.val;
        btnSum.innerText = "翻找中...";
        btnSum.disabled = true;
        try {
          const res = await apiPost("page/l0/summarize", { id: Number(id), category: cat, key: key, value: oldVal });
          if (res.ok) {
            document.getElementById("val-" + id).innerText = res.value;
            btnSum.dataset.val = res.value;
          } else alert(res.msg || "总结失败");
        } catch(err) { alert("请求超时或失败"); }
        btnSum.innerText = "重总结";
        btnSum.disabled = false;
        return;
      }

      // 4. 删除
      const btnDel = e.target.closest(".btn-del");
      if (btnDel) {
        if (!confirm("确认删除这条记录？")) return;
        const kind = btnDel.dataset.kind;
        const id = btnDel.dataset.id;
        try {
          await apiPost(`page/${kind}/delete`, { id: Number(id) });
          if (kind === "l0") loadL0();
          else if (kind === "l1") loadL1();
          else loadL2();
          loadStats();
        } catch(err) { alert("删除失败: " + err.message); }
        return;
      }

      // 5. 归档包点击
      const archiveBtn = e.target.closest(".archive-btn");
      if (archiveBtn) {
        alert("提示：由于 AstrBot 路由限制，请前往服务器目录 /root/astrbot-data/data/plugin_data/astrbot_plugin_cyrene_memory/archives/ 获取该文件。");
        return;
      }
    });

    // --- 初始化 ---
    loadStats();
    loadL0();
    loadL1();
    loadRaw();
    loadL2();
    loadRel();
    loadTasks();
  </script>
</body>
</html>
